<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panel Empresarial</title>
<style>
  :root{--bg:#0f1420;--panel:#171e2e;--panel2:#1e2740;--line:#2a3550;--tx:#e6edf7;--mut:#93a3c0;--ac:#38bdf8;--ok:#22c55e;--err:#ef4444;--warn:#f59e0b}
  *{box-sizing:border-box}
  body{margin:0;font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--tx);font-size:14px}
  h1,h2,h3{margin:0}
  a{color:var(--ac)}
  button{cursor:pointer;font-family:inherit}
  input,select,textarea{font-family:inherit;font-size:14px}
  .login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:radial-gradient(1200px 600px at 50% -10%,#1b2a4a 0%,var(--bg) 60%)}
  .login-card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:2.2rem;width:380px;max-width:92vw;box-shadow:0 20px 60px rgba(0,0,0,.5)}
  .login-card h1{font-size:1.35rem;margin-bottom:.2rem}
  .login-card p{color:var(--mut);margin:.2rem 0 1.4rem}
  .login-card label{display:block;font-size:.8rem;color:var(--mut);margin:.9rem 0 .3rem}
  .login-card input{width:100%;padding:.65rem .8rem;border-radius:8px;border:1px solid var(--line);background:var(--panel2);color:var(--tx);outline:none}
  .login-card input:focus{border-color:var(--ac)}
  .login-card .err{color:var(--err);font-size:.85rem;min-height:1.2em;margin-top:.5rem}
  .btn{background:var(--ac);color:#04121f;border:none;border-radius:8px;padding:.65rem 1rem;font-weight:700;font-size:.95rem;width:100%;margin-top:1rem}
  .btn:hover{filter:brightness(1.1)}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .app{display:flex;min-height:100vh}
  .side{width:230px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column}
  .side .brand{padding:1.2rem 1.2rem 1rem;border-bottom:1px solid var(--line)}
  .side .brand b{font-size:1.05rem}
  .side .brand small{display:block;color:var(--mut);margin-top:.15rem}
  .side nav{flex:1;padding:.6rem}
  .side nav button{display:flex;align-items:center;gap:.6rem;width:100%;text-align:left;background:transparent;border:none;color:var(--tx);padding:.6rem .8rem;border-radius:8px;margin-bottom:.15rem;font-size:.9rem}
  .side nav button:hover{background:var(--panel2)}
  .side nav button.active{background:var(--ac);color:#04121f;font-weight:700}
  .side .us{display:flex;align-items:center;gap:.6rem;padding:1rem;border-top:1px solid var(--line);font-size:.85rem;color:var(--mut)}
  .side .us .nome{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .side .us .role{background:var(--panel2);border:1px solid var(--line);border-radius:20px;padding:.1rem .5rem;font-size:.7rem;color:var(--ac)}
  .side .us button{background:transparent;border:1px solid var(--line);color:var(--mut);border-radius:6px;padding:.3rem .5rem;font-size:.75rem}
  .side .us button:hover{color:var(--err);border-color:var(--err)}
  .main{flex:1;padding:1.4rem 1.6rem 3rem;max-width:1100px}
  .main h2{font-size:1.2rem;margin-bottom:.2rem}
  .main .sub{color:var(--mut);margin:.15rem 0 1.2rem}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:1.1rem;margin-bottom:1rem}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1rem;margin-bottom:1.2rem}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:1rem 1.1rem}
  .stat .k{color:var(--mut);font-size:.8rem}
  .stat .v{font-size:1.5rem;font-weight:800;margin-top:.2rem}
  .stat .v.ok{color:var(--ok)} .stat .v.err{color:var(--err)} .stat .v.warn{color:var(--warn)}
  table{width:100%;border-collapse:collapse;font-size:.86rem}
  th,td{text-align:left;padding:.5rem .6rem;border-bottom:1px solid var(--line)}
  th{color:var(--mut);font-size:.75rem;text-transform:uppercase;letter-spacing:.04em}
  tr:hover td{background:rgba(255,255,255,.02)}
  .badge{display:inline-block;border-radius:20px;padding:.15rem .6rem;font-size:.72rem;font-weight:700}
  .b-ok{background:rgba(34,197,94,.15);color:var(--ok)} .b-err{background:rgba(239,68,68,.15);color:var(--err)}
  .b-warn{background:rgba(245,158,11,.15);color:var(--warn)} .b-ac{background:rgba(56,189,248,.15);color:var(--ac)}
  .toolbar{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:1rem;align-items:center}
  .toolbar button,.btn2{background:var(--panel2);border:1px solid var(--line);color:var(--tx);border-radius:8px;padding:.45rem .8rem;font-size:.85rem}
  .toolbar button:hover,.btn2:hover{border-color:var(--ac);color:var(--ac)}
  .btn2.danger:hover{border-color:var(--err);color:var(--err)}
  .btn2.primary{background:var(--ac);color:#04121f;border-color:var(--ac);font-weight:700}
  input.sel,select.sel{background:var(--panel2);border:1px solid var(--line);color:var(--tx);border-radius:8px;padding:.45rem .7rem;outline:none}
  input.sel:focus{border-color:var(--ac)}
  .empty{color:var(--mut);text-align:center;padding:1.5rem}
  .toast{position:fixed;right:1rem;bottom:1rem;z-index:90;display:flex;flex-direction:column;gap:.5rem;max-width:360px}
  .toast div{background:var(--panel2);border:1px solid var(--line);border-left:4px solid var(--ac);border-radius:8px;padding:.7rem .9rem;font-size:.85rem;box-shadow:0 8px 24px rgba(0,0,0,.4);animation:tin .25s}
  .toast div.ok{border-left-color:var(--ok)} .toast div.err{border-left-color:var(--err)} .toast div.warn{border-left-color:var(--warn)}
  @keyframes tin{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
  textarea.json{width:100%;min-height:300px;background:var(--panel2);border:1px solid var(--line);color:var(--tx);border-radius:10px;padding:.8rem;font-family:Consolas,monospace;font-size:12.5px;resize:vertical;white-space:pre;outline:none}
  textarea.json:focus{border-color:var(--ac)}
  .sec-tabs{display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:1rem}
  .sec-tabs button{background:var(--panel2);border:1px solid var(--line);color:var(--mut);border-radius:8px;padding:.45rem .8rem;font-size:.82rem}
  .sec-tabs button.active{background:var(--ac);color:#04121f;border-color:var(--ac);font-weight:700}
  .hidden{display:none!important}
  .frm{display:grid;grid-template-columns:1fr 1fr;gap:.7rem}
  .frm label{display:flex;flex-direction:column;gap:.25rem;font-size:.78rem;color:var(--mut)}
  .frm label.full{grid-column:1/-1}
  .frm input,.frm select,.frm textarea{background:var(--panel2);border:1px solid var(--line);color:var(--tx);border-radius:8px;padding:.5rem .7rem;outline:none}
  .frm input:focus{border-color:var(--ac)}
  .dlg-overlay{position:fixed;inset:0;background:rgba(4,8,16,.7);display:flex;align-items:center;justify-content:center;z-index:80;padding:1rem}
  .dlg{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:1.3rem;width:560px;max-width:96vw;max-height:90vh;overflow:auto}
  .dlg h3{margin-bottom:1rem}
  .dlg .close{float:right;background:none;border:none;color:var(--mut);font-size:1.2rem}
  .live-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);margin-right:6px;animation:pulse 1.4s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  .mono{font-family:Consolas,monospace;font-size:.8rem}
  .flex{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap}
  @media(max-width:760px){.app{flex-direction:column}.side{width:100%;flex-direction:row;align-items:center}.side nav{display:flex;overflow-x:auto;padding:.4rem}.side nav button{width:auto;white-space:nowrap}.side .brand{display:none}.side .us{padding:.4rem}.main{padding:1rem}}
</style>
</head>
<body>

<div id="loginView" class="login-wrap hidden">
  <div class="login-card">
    <h1>🏢 SOLUCIONA · Panel Empresarial</h1>
    <p>Inicia sesión con tu cuenta del negocio</p>
    <form id="loginForm">
      <label>Correo</label>
      <input type="email" id="lgEmail" autocomplete="username" required>
      <label>Contraseña</label>
      <input type="password" id="lgPass" autocomplete="current-password" required>
      <div id="lg2fa" class="hidden">
        <div id="lgQrBox"></div>
        <label>Código 2FA (Google Authenticator)</label>
        <input type="text" id="lgCode" inputmode="numeric" autocomplete="one-time-code" placeholder="000000">
      </div>
      <div class="err" id="lgErr"></div>
      <button class="btn" id="lgBtn" type="submit">Ingresar</button>
    </form>
  </div>
</div>

<div id="appView" class="app hidden">
  <aside class="side">
    <div class="brand"><b>🏢 SOLUCIONA · Panel Empresarial</b><small id="sideTenant">tenant</small></div>
    <nav id="sideNav"></nav>
    <div class="us">
      <div class="nome" id="usNome">—</div>
      <span class="role" id="usRole">—</span>
      <button onclick="cerrarSesion()" title="Cerrar sesión">Salir</button>
    </div>
  </aside>
  <main class="main">
    <h2 id="viewTitle">Inicio</h2>
    <p class="sub" id="viewSub"></p>
    <div id="viewContent"></div>
  </main>
</div>

<div id="dlgOverlay" class="dlg-overlay hidden"></div>
<div id="toasts" class="toast"></div>

<script src="/socket.io-client.js"></script>
<script src="/panel-empresarial.js"></script>
<script src="/panel-config.js"></script>
<script src="/panel-inventario.js"></script>
<script src="/panel-contabilidad.js"></script>
</body>
</html>

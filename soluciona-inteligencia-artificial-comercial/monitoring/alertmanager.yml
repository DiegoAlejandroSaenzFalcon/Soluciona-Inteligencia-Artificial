global:
  resolve_timeout: 5m
  smtp_smarthost: '${SMTP_HOST:-smtp.gmail.com}:587'
  smtp_from: '${SMTP_FROM:-alerts@soluciona.ai}'
  smtp_auth_username: '${SMTP_USER:-alerts@soluciona.ai}'
  smtp_auth_password: '${SMTP_PASS:-}'
  smtp_require_tls: true

route:
  group_by: ['alertname', 'tenant']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'default'
  routes:
    - match:
        severity: critical
      receiver: 'critical'
      group_wait: 0s
      repeat_interval: 1h
    - match:
        severity: warning
      receiver: 'warning'
      group_wait: 5m
      repeat_interval: 2h

receivers:
  - name: 'default'
    email_configs:
      - to: '${ALERT_EMAIL:-admin@soluciona.ai}'
        send_resolved: true
    slack_configs:
      - api_url: '${SLACK_WEBHOOK_URL}'
        channel: '#alerts'
        send_resolved: true
    webhook_configs:
      - url: 'http://app-dev:3000/api/webhooks/alerts'
        send_resolved: true

  - name: 'critical'
    email_configs:
      - to: '${ALERT_EMAIL_CRITICAL:-admin@soluciona.ai}'
        send_resolved: true
    slack_configs:
      - api_url: '${SLACK_WEBHOOK_URL}'
        channel: '#critical-alerts'
        send_resolved: true
    pagerduty_configs:
      - service_key: '${PAGERDUTY_KEY}'
        severity: critical

  - name: 'warning'
    email_configs:
      - to: '${ALERT_EMAIL_WARNING:-team@soluciona.ai}'
        send_resolved: true
    slack_configs:
      - api_url: '${SLACK_WEBHOOK_URL}'
        channel: '#warning-alerts'
        send_resolved: true

inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'instance']
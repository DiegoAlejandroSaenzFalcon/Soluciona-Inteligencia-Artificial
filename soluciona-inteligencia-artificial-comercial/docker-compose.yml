services:
  app:
    build: .
    container_name: soluciona-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      # - DISABLE_WHATSAPP=true   # descomentar para modo prueba sin WhatsApp
    volumes:
      # Datos persistentes: BD SQLite, sesión de WhatsApp y backups
      - ./data:/app/data
      - ./auth_info:/app/auth_info
      - ./config.json:/app/config.json
      - ./.env:/app/.env:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.status===200?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    depends_on:
      - calling-sidecar

  calling-sidecar:
    build:
      context: .
      dockerfile: Dockerfile.sidecar
    container_name: soluciona-calling-sidecar
    restart: unless-stopped
    ports:
      - "8081:8081"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - SIDECAR_PORT=8081
    volumes:
      - ./data:/app/data
      - ./models:/models:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8081/health').then(r=>process.exit(r.status===200?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  data:
  auth_info:
  models: